    // Audio SFX Synthesis (No external MP3 files needed)
    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'celebrate') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.connect(g);
                    g.connect(ctx.destination);
                    o.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.08));
                    g.gain.setValueAtTime(0.2, ctx.currentTime + (idx * 0.08));
                    g.gain.linearRampToValueAtTime(0.01, ctx.currentTime + (idx * 0.08) + 0.25);
                    o.start(ctx.currentTime + (idx * 0.08));
                    o.stop(ctx.currentTime + (idx * 0.08) + 0.25);
                });
            }
        } catch(e) {
            // Audio Context blocked or unsupported
        }
    }

    // Theme Controller
    function toggleDarkMode() {
        const html = document.documentElement;
        const icon = document.getElementById('theme-toggle-icon');
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            html.classList.add('light');
            icon.className = 'fa-solid fa-moon text-lg text-slate-700';
            localStorage.setItem('knowme_theme', 'light');
        } else {
            html.classList.remove('light');
            html.classList.add('dark');
            icon.className = 'fa-solid fa-sun text-lg text-amber-400';
            localStorage.setItem('knowme_theme', 'dark');
        }
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('knowme_theme');
        const icon = document.getElementById('theme-toggle-icon');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            if (icon) icon.className = 'fa-solid fa-sun text-lg text-amber-400';
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            if (icon) icon.className = 'fa-solid fa-moon text-lg text-slate-700';
        }
    }

    // Storage Management Engine
    const Storage = {
        getKey: (id) => `knowme_quiz_${id}`,
        saveQuiz: (quiz) => {
            try {
                localStorage.setItem(Storage.getKey(quiz.id), JSON.stringify(quiz));
                return true;
            } catch (e) {
                console.error('LocalStorage write error', e);
                return false;
            }
        },
        getQuiz: (id) => {
            try {
                const data = localStorage.getItem(Storage.getKey(id));
                return data ? JSON.parse(data) : null;
            } catch (e) {
                console.error('LocalStorage read error', e);
                return null;
            }
        },
        saveResponse: (quizId, response) => {
            const quiz = Storage.getQuiz(quizId);
            if (!quiz) return false;
            if (!quiz.responses) quiz.responses = [];
            quiz.responses.push(response);
            return Storage.saveQuiz(quiz);
        }
    };

    function generateId(length = 6) {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

        const toast = document.getElementById('toast');

        toastMsg.innerText = message;
        toastIcon.className = iconClass;
        
        toast.classList.remove('translate-y-24', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        
        setTimeout(() => {

        nextFriendQuestion() {
            const q = this.friendState.quiz.questions[this.friendState.currentIndex];
            if (!this.friendState.answers[q.id]) {
                showToast("Please make a prediction for this question!", "fa-solid fa-hand text-amber-400");
                return;

            if (this.friendState.currentIndex < 9) {
                this.friendState.currentIndex++;
                this.renderFriendFlow();

        prevFriendQuestion() {
            if (this.friendState.currentIndex > 0) {
                this.friendState.currentIndex--;

            }
        }

        submitFriendQuiz() {
            const state = this.friendState;
            for (let q of state.quiz.questions) {
                if (!state.answers[q.id]) {
                    showToast("Please answer all questions!", "fa-solid fa-triangle-exclamation text-amber-400");
                    return;
                }
            }

            let score = 0;
            const answerBreakdown = [];
            state.quiz.questions.forEach(q => {
                const creatorAns = state.quiz.answers[q.id];
                const friendAns = state.answers[q.id];
                const isCorrect = creatorAns === friendAns;
                if (isCorrect) score++;

                answerBreakdown.push({
                    questionId: q.id,
                    questionText: q.question,
                    creatorAns,
                    friendAns,
                    isCorrect
                });
            });

            const responseObj = {
                id: generateId(),
                friendName: state.friendName,
                predictedScore: state.predictedScore,
                actualScore: score,
                submittedAt: new Date().toISOString(),
                breakdown: answerBreakdown
            };

            Storage.saveResponse(state.quiz.id, responseObj);
            
            window.lastFriendResult = { quiz: state.quiz, response: responseObj };

            triggerConfetti();
            playSound('celebrate');
            this.navigate(`friend-result/${state.quiz.id}`);

                                <div class="text-4xl animate-bounce">⏳</div>
                                <div class="font-bold text-slate-700 dark:text-slate-300">No responses yet!</div>
                                <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs mx-auto">Share your quiz link with friends to see who knows you best.</p>
                                <button onclick="router.navigate('share/${quiz.id}')" class="gradient-btn text-white text-xs font-extrabold py-2.5 px-4 rounded-xl shadow inline-flex items-center gap-2">
                                    <i class="fa-solid fa-copy"></i> Copy Quiz Link
                                </button>
                            </div>
                        ` : `
                            <div class="space-y-2">
                                ${sortedResponses.map((res, idx) => {
                                    let badge = `<span class="w-6 text-center font-bold text-slate-400 text-xs">#${idx + 1}</span>`;
                                    if (idx === 0) badge = `<span class="text-2xl">🥇</span>`;
                                    else if (idx === 1) badge = `<span class="text-2xl">🥈</span>`;
                                    else if (idx === 2) badge = `<span class="text-2xl">🥉</span>`;

                                    return `
                                        <button onclick="router.showFriendDetail('${quiz.id}', '${res.id}')" 
                                                class="w-full p-4 rounded-2xl bg-white/40 dark:bg-slate-800/40 hover:bg-indigo-500/10 border border-slate-200/50 dark:border-slate-700/50 transition flex items-center justify-between group shadow-sm">
                                            <div class="flex items-center gap-3">
                                                ${badge}
                                                <div class="text-left">
                                                    <div class="font-extrabold text-slate-800 dark:text-slate-100 group-hover:text-indigo-500 transition">${res.friendName}</div>
                                                    <div class="text-xs text-slate-400">Predicted: ${res.predictedScore}/10</div>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-3">
                                                <div class="text-right">
                                                    <div class="font-black text-lg text-indigo-500">${res.actualScore}/10</div>
                                                    <div class="text-[10px] text-slate-400">${new Date(res.submittedAt).toLocaleDateString()}</div>
                                                </div>
                                                <i class="fa-solid fa-chevron-right text-slate-300 dark:text-slate-600 group-hover:text-indigo-500 text-xs transition"></i>
                                            </div>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        showFriendDetail(quizId, responseId) {
            const quiz = Storage.getQuiz(quizId);
            if (!quiz) return;
            const res = (quiz.responses || []).find(r => r.id === responseId);
            if (!res) return;

            const contentHtml = `
                <div class="space-y-3">
                    <div class="bg-indigo-500/10 p-4 rounded-2xl border border-indigo-500/20 flex justify-between items-center text-xs">
                        <div>
                            <span class="text-slate-500 dark:text-slate-400 font-bold">Predicted:</span>
                            <span class="font-black text-indigo-500 ml-1">${res.predictedScore}/10</span>
                        </div>
                        <div>
                            <span class="text-slate-500 dark:text-slate-400 font-bold">Actual Score:</span>
                            <span class="font-black text-indigo-500 ml-1">${res.actualScore}/10</span>
                        </div>
                    </div>

                    <div class="space-y-2 pt-1">
                        ${res.breakdown.map((b, idx) => `
                            <div class="p-3 rounded-2xl border text-xs ${b.isCorrect ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-rose-500/30 bg-rose-500/5'} space-y-1">
                                <div class="font-bold text-slate-800 dark:text-slate-200">${idx + 1}. ${b.questionText}</div>
                                <div class="flex justify-between pt-1">
                                    <span class="${b.isCorrect ? 'text-emerald-600 dark:text-emerald-400 font-black' : 'text-rose-600 dark:text-rose-400 font-black'}">
                                        ${res.friendName}: "${b.friendAns}"
                                    </span>
                                    <span class="text-slate-400 font-semibold">
                                        ${quiz.creatorName}: "${b.creatorAns}"
                                    </span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            playSound('select');
            openModal(
                `${res.friendName}'s Answers`, 
                `Score: ${res.actualScore}/10 (Predicted: ${res.predictedScore}/10)`, 
                contentHtml
            );
        }

        render404() {
            this.viewport.innerHTML = `
                <div class="glass-card rounded-3xl p-8 text-center space-y-4">
                    <div class="text-5xl">🔍</div>
                    <h2 class="text-2xl font-black text-slate-800 dark:text-white">Quiz Not Found</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">The quiz link or code might be invalid or expired from local storage.</p>
                    <button onclick="router.navigate('')" class="gradient-btn text-white font-extrabold py-3 px-6 rounded-2xl text-sm shadow-lg">
                        Back to Home
                    </button>
                </div>
            `;
        }
    }

    let router;
    window.addEventListener('DOMContentLoaded', () => {
        router = new AppRouter();
    });
    </script>
</body>
</html>
